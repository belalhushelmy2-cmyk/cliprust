name: Native build and packages
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libx11-dev libxcb1-dev libwayland-dev
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
  linux-packages:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-0 libx11-dev libxcb1-dev libwayland-dev libxcursor1 libxi6 libxrandr2 rpm zstd xz-utils
      - run: cargo build --locked --release
      - run: scripts/package-linux.sh
      - name: Build and smoke-test portable AppImage
        shell: bash
        run: |
          curl -fsSL https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -o "$RUNNER_TEMP/appimagetool.AppImage"
          curl -fsSL https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64 -o "$RUNNER_TEMP/appimage-runtime"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool.AppImage" | sha256sum --check --strict
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  $RUNNER_TEMP/appimage-runtime" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/appimagetool.AppImage"
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool.AppImage" APPIMAGE_RUNTIME="$RUNNER_TEMP/appimage-runtime" scripts/package-appimage.sh
          dist/releases/*/*.AppImage --appimage-extract-and-run --version
      - run: scripts/smoke-linux-packages.sh
      - run: python3 scripts/finalize-release.py --source
      - uses: actions/upload-artifact@v4
        with:
          name: cliprust-linux-x86_64
          path: dist/releases/*/*
          if-no-files-found: error
  windows-installer:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - run: target/release/cliprust.exe --version
      - name: Package NSIS installer and portable ZIP
        shell: pwsh
        run: |
          $version = ((Select-String '^version = "([^"]+)"' Cargo.toml | Select-Object -First 1).Matches.Groups[1].Value)
          $output = Join-Path $PWD "dist/releases/$version"
          $payload = Join-Path $env:RUNNER_TEMP "cliprust-$version-windows-x86_64"
          New-Item -ItemType Directory -Force $output, $payload
          Copy-Item target/release/cliprust.exe, LICENSE, TEST_RESULTS.md $payload
          Copy-Item RELEASES.md "$payload/README.md"
          python scripts/third-party-notices.py "$payload/THIRD-PARTY-NOTICES.txt"
          $nsis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (!(Test-Path $nsis)) { choco install nsis -y --no-progress }
          & $nsis "/DVERSION=$version" "/DPAYLOAD=$payload" "/DOUTPUT=$output/Cliprust-$version-windows-x86_64-Setup.exe" packaging/windows/installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS failed: $LASTEXITCODE" }
          Compress-Archive $payload "$output/cliprust-$version-windows-x86_64-portable.zip"
      - run: python scripts/finalize-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: cliprust-windows-x86_64
          path: dist/releases/*/*
          if-no-files-found: error
