[package]
name = "cliprust"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-only"
description = "A native, local-first clipboard history for Windows and Linux"

[features]
default = ["desktop"]
desktop = ["dep:slint", "dep:slint-build", "dep:tray-icon"]

[dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"], optional = true }
anyhow = "1"
crossbeam-channel = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
url = "2.5"
clipboard-rs = "0.3.5"
slint = { version = "1.18.1", optional = true, default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "unstable-winit-030"] }

[target.'cfg(target_os = "linux")'.dependencies]
glob = "0.3"
shlex = "1.3"
wayland-client = "0.31"
wayland-scanner = "0.31"
xkbcommon = "0.9"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
raw-window-handle = "0.6"
zbus = { version = "5", default-features = false, features = ["tokio"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wl-clipboard-rs = "0.9"
libc = "0.2"
x11rb = { version = "0.13", features = ["xtest"] }
ashpd = { version = "0.13", features = ["global_shortcuts", "settings", "file_chooser", "remote_desktop", "screencast"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "time", "net", "io-util", "sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_DataExchange", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Controls_Dialogs"] }

[build-dependencies]
slint-build = { version = "1.18.1", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[package.metadata.deb]
maintainer = "Cliprust contributors"
section = "utils"
priority = "optional"
depends = "$auto, libfontconfig1, libxkbcommon0, libx11-6, libx11-xcb1, libxcb1, libxcursor1, libxi6, libxrandr2, libxkbcommon-x11-0, libwayland-client0, xkb-data, fonts-dejavu-core, xdg-utils"
assets = [
  ["target/release/cliprust", "usr/bin/", "755"],
  ["packaging/linux/cliprust.desktop", "usr/share/applications/", "644"],
  ["packaging/linux/cliprust.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
  ["README.md", "usr/share/doc/cliprust/", "644"],
  ["LICENSE", "usr/share/licenses/cliprust/", "644"],
  ["packaging/linux/org.cliprust.Cliprust.metainfo.xml", "usr/share/metainfo/", "644"],
]
